<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UPI QR Pay</title>
<meta name="theme-color" content="#0b3b35" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="UPI Pay" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="jsQR.js"></script>
<style>
:root{--ink:#0b3b35;--ink2:#14524a;--paper:#f2f7f5;--card:#fff;--line:#c9dbd6;--text:#0d1f1b;--muted:#4b625d;--accent:#f5a623;--accent-ink:#3a2500;--chip:#e7f0ed;--warn-bg:#fff4d6;--warn-ink:#6b4500;--bad-bg:#fde4e1;--bad-ink:#8c1d14;--ok:#1c7a4c}
@media(prefers-color-scheme:dark){:root{--paper:#0a1513;--card:#112320;--line:#2a4640;--text:#eef6f3;--muted:#9ab3ad;--chip:#17302c;--ink:#1d6b5f;--ink2:#2b9183;--warn-bg:#3a2e0c;--warn-ink:#ffd98a;--bad-bg:#3b1612;--bad-ink:#ffb3aa;--ok:#5fd39a}}
*{box-sizing:border-box;margin:0}
html{font-size:18px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--paper);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:480px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.brand img{width:36px;height:36px;border-radius:10px}
.tools{display:flex;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;min-height:44px}
h1{font-size:1.75rem;line-height:1.18;letter-spacing:-.02em;font-weight:800;margin-bottom:8px}
.lead{color:var(--muted);margin-bottom:18px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:34px 14px;cursor:pointer;border:2.5px dashed var(--ink2);border-radius:18px;background:var(--chip)}
.drop:focus-visible,.drop.over{outline:4px solid var(--accent)}
.drop svg{width:48px;height:48px;color:var(--ink2)}
.drop strong{font-size:1.2rem}.drop small{color:var(--muted);font-size:.85rem}
.priv{color:var(--muted);font-size:.8rem;text-align:center;margin-top:12px}
input[type=file]{display:none}
.hidden{display:none!important}
.payee{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem;flex:none}
.payee .lbl{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.payee b{display:block;font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.payee span.id{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:.92rem;font-weight:600}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink)}.alert.bad{background:var(--bad-bg);color:var(--bad-ink)}
.q{font-weight:800;font-size:1.1rem;margin:14px 0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:14px;border:0;border-radius:16px;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;margin-bottom:10px;text-align:center}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.pill:focus-visible,.chip:focus-visible,summary:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.btn-yes{background:var(--ink);color:#fff}.btn-no{background:var(--chip);color:var(--text)}
.btn-gpay{background:#1a73e8;color:#fff}.btn-phonepe{background:#5f259f;color:#fff}.btn-paytm{background:#0086b3;color:#fff}.btn-bhim{background:#e8590c;color:#fff}
.done{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:800;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:0 0 16px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:.98rem}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.pinrule{background:var(--bad-bg);color:var(--bad-ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:.92rem;margin-bottom:14px}
details{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:4px 16px;margin-bottom:16px}
summary{cursor:pointer;font-weight:800;padding:12px 0;min-height:44px}
details ul{padding-left:1.1rem;margin:0 0 12px}details li{margin-bottom:8px;font-size:.95rem}
.sec h2{font-size:1rem;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec h2 button{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:10px 16px;font:inherit;font-size:.92rem;cursor:pointer;min-height:44px}
.empty{color:var(--muted);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--paper);padding:12px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;z-index:99;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="icons/icon-192.png" alt="" /><span data-t="brand"></span></div>
    <div class="tools">
      <button id="installBtn" class="pill hidden" type="button" data-t="install"></button>
      <button id="langBtn" class="pill" type="button" aria-label="Language">हिन्दी</button>
    </div>
  </header>

  <!-- STEP 1: pick -->
  <main id="s1">
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="panel">
      <label class="drop" id="drop" for="qrInput" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M12 15V9M9 12l3-3 3 3"/></svg>
        <strong data-t="choose"></strong><small data-t="chooseSub"></small>
      </label>
      <input type="file" id="qrInput" accept="image/*" />
      <canvas id="qrCanvas" class="hidden"></canvas>
      <p class="priv" data-t="privacy"></p>
    </div>
    <section class="sec">
      <h2><span data-t="recent"></span><button id="clearBtn" type="button" data-t="clear"></button></h2>
      <div class="chips" id="recent"></div>
    </section>
  </main>

  <!-- STEP 2: confirm payee -->
  <main id="s2" class="hidden">
    <div class="panel">
      <div class="payee">
        <div class="avatar" id="avatar">M</div>
        <div><div class="lbl" data-t="payingTo"></div><b id="pName"></b><span class="id" id="pId"></span></div>
      </div>
      <div id="alerts"></div>
      <div class="q" data-t="trustQ"></div>
      <button class="btn btn-yes" id="yesBtn" type="button" data-t="yes"></button>
      <button class="btn btn-no" id="noBtn" type="button" data-t="no"></button>
    </div>
  </main>

  <!-- STEP 3: open app -->
  <main id="s3" class="hidden">
    <div class="panel">
      <div class="done"><span aria-hidden="true">✓</span><span data-t="copied"></span></div>
      <div class="q" style="margin-top:0" data-t="pickApp"></div>
      <button class="btn btn-gpay" data-app="gpay" type="button">Google Pay</button>
      <button class="btn btn-phonepe" data-app="phonepe" type="button">PhonePe</button>
      <button class="btn btn-paytm" data-app="paytm" type="button">Paytm</button>
      <button class="btn btn-bhim" data-app="bhim" type="button">BHIM</button>
      <div class="q" data-t="whatNext"></div>
      <ol class="steps" id="steps"></ol>
      <div class="pinrule" data-t="pinRule"></div>
      <button class="btn btn-no" id="againBtn" type="button" data-t="again"></button>
    </div>
  </main>

  <details>
    <summary data-t="safeTitle"></summary>
    <ul id="safeList"></ul>
  </details>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const T = {
en:{brand:"UPI QR Pay",install:"Install",title:"Pay using a QR picture",lead:"Pick a QR picture from your phone. We read it, then you pay safely inside your own UPI app.",choose:"Choose QR picture",chooseSub:"Tap here and pick from gallery",privacy:"🔒 Your picture stays on this phone. Nothing is uploaded.",recent:"Recent payees",clear:"Clear",empty:"Payees you use will show here.",payingTo:"You are paying",trustQ:"Do you know and trust this person or shop?",yes:"Yes, continue",no:"No, cancel",copied:"UPI ID copied",pickApp:"Open your payment app",whatNext:"Then in your app:",again:"Start over",pinRule:"Enter your UPI PIN only to PAY. Never to receive money.",
 s1:"Tap “To Mobile / UPI ID”",s2:"Press and hold the box, then tap Paste",s3:(n)=>`Check the name shown is “${n}”. If it is different, stop.`,s4:"Type the amount, then your UPI PIN",
 amt:(a)=>`This QR already has an amount: ₹${a}. Make sure it is correct.`,noName:"This QR has no name. Be extra careful and ask the person to confirm.",badId:"This UPI ID looks wrong. Do not pay.",
 noQR:"No UPI QR found. Try a clearer picture.",noId:"This QR has no UPI ID.",readErr:"Could not read that picture.",toastCopied:(i)=>`Copied ${i}`,
 safeTitle:"Stay safe from scams",safe:["If someone says “you will RECEIVE money, scan this or enter your PIN”, it is a scam. PIN is only for paying.","Never share your UPI PIN, OTP or card details. Not even with bank staff.","Pay only people and shops you know. Check the name in your app before you pay.","Got a QR from an unknown message or a stranger online? Do not use it."]},
hi:{brand:"UPI QR पे",install:"इंस्टॉल",title:"QR फोटो से पेमेंट करें",lead:"अपने फोन से QR की फोटो चुनें। हम उसे पढ़ेंगे, फिर आप अपने UPI ऐप में सुरक्षित तरीके से पेमेंट करें।",choose:"QR फोटो चुनें",chooseSub:"यहाँ दबाएँ और गैलरी से चुनें",privacy:"🔒 आपकी फोटो फोन में ही रहती है। कुछ अपलोड नहीं होता।",recent:"पिछले पेमेंट",clear:"हटाएँ",empty:"जिन्हें आप पेमेंट करेंगे वे यहाँ दिखेंगे।",payingTo:"आप पेमेंट कर रहे हैं",trustQ:"क्या आप इस व्यक्ति या दुकान को जानते और भरोसा करते हैं?",yes:"हाँ, आगे बढ़ें",no:"नहीं, रद्द करें",copied:"UPI ID कॉपी हो गई",pickApp:"अपना पेमेंट ऐप खोलें",whatNext:"फिर अपने ऐप में:",again:"फिर से शुरू करें",pinRule:"UPI PIN सिर्फ पैसे भेजने के लिए डालें। पैसे पाने के लिए कभी नहीं।",
 s1:"“To Mobile / UPI ID” दबाएँ",s2:"बॉक्स को दबाकर रखें, फिर Paste दबाएँ",s3:(n)=>`जाँचें कि दिख रहा नाम “${n}” है। अलग हो तो रुक जाएँ।`,s4:"रकम लिखें, फिर UPI PIN डालें",
 amt:(a)=>`इस QR में पहले से रकम भरी है: ₹${a}। जाँच लें कि सही है।`,noName:"इस QR में नाम नहीं है। सावधान रहें और सामने वाले से पुष्टि करें।",badId:"यह UPI ID गलत लग रही है। पेमेंट न करें।",
 noQR:"UPI QR नहीं मिला। साफ फोटो चुनें।",noId:"इस QR में UPI ID नहीं है।",readErr:"फोटो पढ़ी नहीं जा सकी।",toastCopied:(i)=>`कॉपी हुआ: ${i}`,
 safeTitle:"ठगी से बचें",safe:["कोई कहे “पैसे पाने के लिए QR स्कैन करो या PIN डालो”, तो यह ठगी है। PIN सिर्फ पैसे भेजने के लिए है।","UPI PIN, OTP या कार्ड की जानकारी किसी को न बताएँ। बैंक वाले को भी नहीं।","सिर्फ जान-पहचान वालों और जानी-पहचानी दुकानों को पेमेंट करें। पेमेंट से पहले ऐप में नाम जाँचें।","अनजान मैसेज या अजनबी से मिला QR इस्तेमाल न करें।"]}
};
const $=id=>document.getElementById(id);
const safe=(fn,fb)=>{try{return fn()}catch{return fb}};
let lang=safe(()=>localStorage.getItem("lang"),null)||((navigator.language||"").startsWith("hi")?"hi":"en");
const t=(k,...a)=>{const v=T[lang][k];return typeof v==="function"?v(...a):v};
const toast=m=>{const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2800)};
const isAndroid=/Android/i.test(navigator.userAgent);
let cur=null; // {pa,pn,am}

function applyLang(){
  document.documentElement.lang=lang;
  $("langBtn").textContent=lang==="en"?"हिन्दी":"English";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("safeList").innerHTML="";T[lang].safe.forEach(s=>{const li=document.createElement("li");li.textContent=s;$("safeList").appendChild(li)});
  renderRecent(); if(cur){renderPayee();renderSteps()}
}
$("langBtn").onclick=()=>{lang=lang==="en"?"hi":"en";safe(()=>localStorage.setItem("lang",lang));applyLang()};

/* PWA */
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
let dp;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("installBtn").classList.remove("hidden")});
$("installBtn").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("installBtn").classList.add("hidden")};
addEventListener("appinstalled",()=>$("installBtn").classList.add("hidden"));

/* Steps */
const show=id=>{["s1","s2","s3"].forEach(s=>$(s).classList.toggle("hidden",s!==id));scrollTo(0,0)};

/* Clipboard */
async function copyText(x){
  try{await navigator.clipboard.writeText(x)}
  catch{const a=document.createElement("textarea");a.value=x;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
}

/* Recent */
const getRecent=()=>safe(()=>JSON.parse(localStorage.getItem("upi_recent")||"[]"),[]);
function saveRecent(p){const l=getRecent().filter(x=>x.pa!==p.pa);l.unshift({pa:p.pa,pn:p.pn});safe(()=>localStorage.setItem("upi_recent",JSON.stringify(l.slice(0,6))))}
function renderRecent(){
  const l=getRecent(),b=$("recent");$("clearBtn").classList.toggle("hidden",!l.length);
  if(!l.length){b.innerHTML="";const s=document.createElement("span");s.className="empty";s.textContent=t("empty");b.appendChild(s);return}
  b.innerHTML="";l.forEach(p=>{const c=document.createElement("button");c.className="chip";c.type="button";c.textContent=p.pn;c.title=p.pa;c.onclick=()=>begin({pa:p.pa,pn:p.pn,am:""});b.appendChild(c)});
}
$("clearBtn").onclick=()=>{safe(()=>localStorage.removeItem("upi_recent"));renderRecent()};

/* QR reading */
const input=$("qrInput"),drop=$("drop");
input.addEventListener("change",e=>e.target.files[0]&&decodeFile(e.target.files[0]));
["dragenter","dragover"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>e.dataTransfer.files[0]&&decodeFile(e.dataTransfer.files[0]));
drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click()}});
document.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/"));if(f)decodeFile(f)});

function decodeFile(file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const c=$("qrCanvas"),x=c.getContext("2d",{willReadFrequently:true});let code=null;
    for(const max of[1000,600,1600]){
      const s=Math.min(1,max/Math.max(img.width,img.height));
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      x.drawImage(img,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height);
      code=jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});if(code)break;
    }
    URL.revokeObjectURL(url);
    if(!code||!/^upi:\/\//i.test(code.data))return toast(t("noQR"));
    const u=new URL(code.data.replace(/^upi:\/\/pay/i,"https://upi.local/"));
    const pa=(u.searchParams.get("pa")||"").trim();
    if(!pa)return toast(t("noId"));
    begin({pa,pn:(u.searchParams.get("pn")||"").trim(),am:u.searchParams.get("am")||""});
  };
  img.onerror=()=>toast(t("readErr"));
  img.src=url;input.value="";
}

/* Confirm payee */
const VALID=/^[a-z0-9][a-z0-9._-]{1,255}@[a-z][a-z0-9.-]{1,63}$/i;
function begin(p){cur=p;renderPayee();show("s2")}
function renderPayee(){
  const name=cur.pn||cur.pa;
  $("pName").textContent=name;$("pId").textContent=cur.pa;$("avatar").textContent=(name.trim()[0]||"?").toUpperCase();
  const box=$("alerts");box.innerHTML="";
  const add=(cls,m)=>{const d=document.createElement("div");d.className="alert "+cls;d.textContent=m;box.appendChild(d)};
  const ok=VALID.test(cur.pa);
  if(!ok)add("bad",t("badId"));
  if(!cur.pn)add("warn",t("noName"));
  if(Number(cur.am)>0)add("warn",t("amt",cur.am));
  $("yesBtn").disabled=!ok;$("yesBtn").style.opacity=ok?1:.4;
}
$("noBtn").onclick=()=>{cur=null;show("s1")};
$("againBtn").onclick=()=>{cur=null;show("s1")};
$("yesBtn").onclick=async()=>{
  if(!cur||!VALID.test(cur.pa))return;
  saveRecent(cur);await copyText(cur.pa);toast(t("toastCopied",cur.pa));renderSteps();show("s3");
};
function renderSteps(){
  const o=$("steps");o.innerHTML="";
  [t("s1"),t("s2"),t("s3",cur.pn||cur.pa),t("s4")].forEach(s=>{const li=document.createElement("li");li.textContent=s;o.appendChild(li)});
}

/* Open app home screen only (no payment details in the link), so the app's own checks stay in charge */
const APPS={gpay:["com.google.android.apps.nbu.paisa.user","tez://"],phonepe:["com.phonepe.app","phonepe://"],paytm:["net.one97.paytm","paytmmp://"],bhim:["in.org.npci.upiapp","bhim://"]};
document.querySelectorAll("[data-app]").forEach(b=>b.onclick=async()=>{
  const [pkg,scheme]=APPS[b.dataset.app];
  if(cur)await copyText(cur.pa);
  const store=encodeURIComponent("https://play.google.com/store/apps/details?id="+pkg);
  location.href=isAndroid?`intent://#Intent;package=${pkg};S.browser_fallback_url=${store};end`:scheme;
});

applyLang();
</script>
</body>
</html>
